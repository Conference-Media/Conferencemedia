<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thanks | Conference Media</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--paper:#F2EFE9;--muted:#A9A49B;--red:#E8392F;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:#000;color:var(--paper);font:17px/1.6 "Inter",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px 16px}
img{height:40px;width:auto;margin:0 auto 40px;display:block}
h1{font:400 clamp(36px,6vw,64px)/1.05 "Gloock",Georgia,serif;margin:0 0 16px}
p{color:var(--muted);max-width:30em;margin:0 auto 32px}
.r{color:var(--red)}
a{display:inline-block;text-decoration:none;font-weight:600;padding:13px 24px;border-radius:999px;background:var(--red);color:#fff}
</style>
</head>
<body>
<main>
  <img src="/img/logo.png" alt="Conference Media">
  <h1>Thanks<span class="r">,</span> we got it<span class="r">.</span></h1>
  <p>We'll look over your event details and get back to you within one business day.</p>
  <a href="/">Back to Home</a>
</main>
</body>
</html>
