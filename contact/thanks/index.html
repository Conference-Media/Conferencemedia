<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/js/consent.js"></script>
<script>gtag('event','contact_message_sent');</script>
<title>Message sent | Conference Media</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/mbw5cmn.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--paper:#F2EFE9;--muted:#A9A49B;--red:#E8392F;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:#000;color:var(--paper);font:17px/1.6 "Manrope",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px 16px}
img{height:40px;width:auto;margin:0 auto 40px;display:block}
h1{font:400 clamp(36px,6vw,64px)/1.05 "the-seasons",Georgia,serif;margin:0 0 16px}
p{color:var(--muted);max-width:30em;margin:0 auto 32px}
.r{color:var(--red)}
a{display:inline-block;text-decoration:none;font-weight:600;padding:13px 24px;border-radius:999px;background:var(--red);color:#fff}
</style>
<link rel="stylesheet" href="/css/motion.css">
<script>/* Motion on; and if we arrived by a link, put the spinning emblem up before the page draws */
(function(d){try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;d.classList.add('mo');
var t=+sessionStorage.getItem('cm-t');if(!t)return;sessionStorage.removeItem('cm-t');if(Date.now()-t>15000)return;
function c(k){var s='<div class="coin '+k+'"'+(k=='w'?' hidden':'')+'>';for(var i=7;i>0;i--)s+='<i class="ly" style="--z:'+i+'"></i>';return s+'<i class="top"></i><i class="sheen"></i></div>'}
var v=document.createElement('div');v.id='cm-veil';v.className='on spin';v.setAttribute('aria-hidden','true');v.dataset.t=t;
v.style.setProperty('--sd',-Math.max(0,Date.now()-t)+'ms');v.innerHTML='<div class="stage">'+c('w')+c('e')+'</div>';
d.appendChild(v);d.classList.add('cm-in');setTimeout(function(){if(!v.dataset.done&&v.parentNode)v.remove()},9000)}catch(e){}})(document.documentElement)</script>
<script src="/js/motion.js" defer></script>
</head>
<body>
<main>
  <img src="/img/logo.png" alt="Conference Media">
  <h1>Thanks<span class="r">,</span> we got your message<span class="r">.</span></h1>
  <p>We'll read it and get back to you soon.</p>
  <a href="/">Back to Home</a>
</main>
</body>
</html>
